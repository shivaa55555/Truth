workflows:
  truth-spice-android:
    name: Truth Spice Android Build
    environment:
      flutter: stable
    scripts:
      - name: Create iOS directory
        script: |
          mkdir -p ios
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk  # ✅ ONLY APK
    publishing:
      email:
        recipients:
          - your-email@gmail.com
        notify:
          success: true
          failure: true

triggering:
  events:
    - push
  branch_patterns:
    - pattern: 'main'
      include: true
      source: true
